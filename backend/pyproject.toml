[project]
name = "chess-coach-backend"
version = "0.1.0"
description = "Backend for the chess-coach app: game import, analysis, weakness profile, practice."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "python-chess>=1.999",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
